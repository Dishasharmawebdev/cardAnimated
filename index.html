<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardAnimated</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            justify-items: center;
            justify-content: center;
            
        }
.card{
    width:200px;
    height:260px;
    background:#07182E;
    position:relative;
    display: flex;
    place-content: center;
    overflow: hidden;
    border-radius: 20px;
    margin-top: 20rem;
    
    
}
.card h2{
    z-index: 1;
    color:white;
    font-size: 2em;
    margin: auto;



}
.card::before{
    content: '';
    position: absolute;
    width:105px;
    background-image: linear-gradient(180deg,rgb(0,183,255),rgb(255,48,255));
    height:130%;
    animation:rotBGimg 3s linear infinite;
    transition:all 0.2s linear;
}
@keyframes rotBGimg {
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}
.card::after {
    content: '';
    position:absolute;
    background: #07182e;
    inset:5px;
    border-radius: 15px;
}
    </style>
</head>
<body>
    <div class="card">
        <h2>CARD</h2>
    </div>
</body>
</html>
